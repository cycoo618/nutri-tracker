<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在连接 Notion…</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f6; color: #37352f; text-align: center;
    }
    .card { padding: 32px 24px; }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 16px;
      border: 3px solid #e6e4de; border-top-color: #37352f; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.btn {
      display: none; margin-top: 20px; padding: 10px 24px;
      background: #37352f; color: #fff; text-decoration: none; border-radius: 10px; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p id="msg">正在返回应用…</p>
    <a class="btn" id="open" href="#">返回 App 完成连接</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('code') || '';
      var state = params.get('state') || '';
      var error = params.get('error') || '';

      if (state.indexOf('native-') === 0) {
        // 原生 iOS：通过 URL scheme 深链回 App
        var target = 'com.yc.nutritrack://notion-oauth?' +
          'code=' + encodeURIComponent(code) +
          '&state=' + encodeURIComponent(state) +
          (error ? '&error=' + encodeURIComponent(error) : '');
        location.href = target;
        // SFSafariViewController 有时不允许自动跳转 scheme，显示手动按钮兜底
        setTimeout(function () {
          var btn = document.getElementById('open');
          btn.href = target;
          btn.style.display = 'inline-block';
          document.getElementById('msg').textContent = '如果没有自动返回，请点击下方按钮：';
        }, 1200);
      } else {
        // Web：带参数跳回应用首页，由 App 完成 token 交换
        location.replace('./?notion_code=' + encodeURIComponent(code) +
          '&notion_state=' + encodeURIComponent(state) +
          (error ? '&notion_error=' + encodeURIComponent(error) : ''));
      }
    })();
  </script>
</body>
</html>
